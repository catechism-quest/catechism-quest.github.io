<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catechism Quest</title>
<meta name="description" content="Learn the Westminster Shorter Catechism and the Heidelberg Catechism with a pixel-art quest.">
<meta name="theme-color" content="#5ec4ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catechism Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --k:#1b1530;--sky1:#5ec4ff;--sky2:#86d6ff;--sky3:#b3e8ff;--grass:#47d16a;--grass2:#2a9a48;
 --pri:#7b4dff;--pri2:#5a2fd6;--acc:#ff9a3c;--acc2:#d9661a;--ok:#2ec463;--ok2:#1d8f45;--bad:#ff3b5c;--gold:#ffd23f;--gold2:#e0a800;
 --paper:#fffaf0;--mut:#6a6385;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* quests */
.qcard{display:block;width:100%;text-align:left;border:4px solid var(--k);background:var(--paper);color:var(--k);padding:14px;margin-bottom:14px;cursor:pointer;box-shadow:5px 5px 0 var(--k);font:inherit}
.qcard.on{background:#fff4c2;outline:4px solid var(--gold);outline-offset:-10px}
.qcard .qt{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.5}
.qcard .qy{font-size:16px;color:var(--mut);margin:6px 0 10px}
.qbar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 14px;border:4px solid var(--k);background:#2b2350;color:#fff;padding:8px 10px;font-family:'Press Start 2P',monospace;font-size:10px;cursor:pointer;box-shadow:3px 3px 0 var(--k);text-align:left}
.qbar .sp{flex:1}
.refs{font-size:15px;color:var(--mut);line-height:1.45;margin-top:10px;border-top:3px dashed #d8d1e6;padding-top:10px}
.src{font-size:15px;color:var(--mut);line-height:1.4;margin:6px 0 12px}
html,body{margin:0;min-height:100%;color:var(--k);font-family:'Pixelify Sans',ui-monospace,monospace;font-weight:500}
body{background:linear-gradient(var(--sky1) 0 22%,var(--sky2) 22% 48%,var(--sky3) 48% 100%) fixed;overflow-x:hidden}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:96px;height:24px;background:#fff;box-shadow:24px -16px 0 #fff,48px -16px 0 #fff,24px -24px 0 #fff,48px -24px 0 0 #fff;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 12px)}
.pf{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;letter-spacing:.5px}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
h1,h2,h3{font-family:'Press Start 2P',monospace;font-weight:400;line-height:1.5}
.box{background:var(--paper);border:4px solid var(--k);box-shadow:6px 6px 0 rgba(27,21,48,.35);padding:16px;margin:0 0 16px;position:relative}
.box.dark{background:#2b2350;color:#fff}
.box.dark .lbl{color:#cfc6ff}
.lbl{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--mut);margin-bottom:10px;letter-spacing:1px}
.btn{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.4;border:4px solid var(--k);background:#fff;color:var(--k);padding:14px 14px;cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.5),4px 4px 0 var(--k);min-height:52px;position:relative}
.btn:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.5),1px 1px 0 var(--k)}
.btn.pri{background:var(--pri);color:#fff}.btn.acc{background:var(--acc);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.gold{background:var(--gold)}.btn.bad{background:#ffe1e7;color:var(--bad)}
.btn.sm{font-size:10px;padding:10px;min-height:42px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1}
.col{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.tiny{font-size:15px;color:var(--mut)}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hud .who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:4px solid var(--k);padding:4px 10px 4px 4px;font-family:'Press Start 2P',monospace;font-size:10px;cursor:pointer;color:var(--k);height:46px;box-shadow:3px 3px 0 var(--k)}
.hud .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:4px solid var(--k);padding:5px 6px;font-family:'Press Start 2P',monospace;font-size:11px;min-width:0}
.chip i{font-style:normal;font-size:7px;color:var(--mut);margin-left:auto}
@media (max-width:360px){.chip i{display:none}}
.ib{width:46px;height:46px;border:4px solid var(--k);background:var(--paper);font-size:18px;cursor:pointer;box-shadow:3px 3px 0 var(--k);padding:0;color:var(--k)}
.ib:active{transform:translate(2px,2px);box-shadow:none}
.ib.off{opacity:.5}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .ttl{flex:1;text-align:center;font-family:'Press Start 2P',monospace;font-size:12px;color:#fff;text-shadow:3px 3px 0 var(--k)}
/* title */
.title{text-align:center;padding-top:6vh}
.logo{font-family:'Press Start 2P',monospace;font-size:30px;line-height:1.35;color:var(--gold);text-shadow:4px 4px 0 var(--k),-2px -2px 0 var(--k),2px -2px 0 var(--k),-2px 2px 0 var(--k);margin:10px 0 6px}
.logo small{display:block;font-size:13px;color:#fff;margin-top:12px}
.parade{display:flex;justify-content:center;gap:14px;margin:30px 0 12px}
.parade img{animation:hop 1s steps(2) infinite}
.parade img:nth-child(2){animation-delay:.25s}.parade img:nth-child(3){animation-delay:.5s}.parade img:nth-child(4){animation-delay:.75s}
@keyframes hop{50%{transform:translateY(-8px)}}
.ground{height:28px;background:var(--grass);border-top:4px solid var(--k);box-shadow:inset 0 -10px 0 var(--grass2);margin:0 -12px 30px}
.blink{font-family:'Press Start 2P',monospace;font-size:14px;color:#fff;text-shadow:3px 3px 0 var(--k);animation:blink 1s steps(1) infinite;cursor:pointer;display:inline-block;padding:16px}
@keyframes blink{50%{opacity:0}}
/* hero select */
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hcard{border:4px solid var(--k);background:var(--paper);padding:12px 6px 10px;text-align:center;cursor:pointer;box-shadow:4px 4px 0 var(--k);color:var(--k)}
.hcard.on{background:#fff4c2;outline:4px solid var(--gold);outline-offset:-10px}
.hcard .hn{font-family:'Press Start 2P',monospace;font-size:11px;margin-top:8px}
.hcard .hd{font-size:15px;color:var(--mut);margin-top:4px}
.hcard.on img{animation:hop .6s steps(2) infinite}
input.name{width:100%;border:4px solid var(--k);background:#fff;font:600 22px 'Pixelify Sans',monospace;padding:12px;color:var(--k)}
.plist{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.pbtn{display:flex;align-items:center;gap:12px;border:4px solid var(--k);background:var(--paper);padding:8px 12px;cursor:pointer;box-shadow:4px 4px 0 var(--k);text-align:left;color:var(--k);font:inherit}
.pbtn .pn{font-family:'Press Start 2P',monospace;font-size:12px}
.pbtn .pp{font-size:16px;color:var(--mut);margin-top:6px}
/* map */
.land{margin-bottom:8px}
.landname{display:inline-flex;align-items:center;gap:10px;background:var(--k);color:#fff;padding:6px 12px 6px 6px;margin:6px 0 0;border:4px solid var(--k);box-shadow:4px 4px 0 rgba(27,21,48,.35);max-width:100%}
.landname .emb{width:40px;height:40px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.22);border:3px solid rgba(27,21,48,.5)}
.landname b{display:block;font-family:'Press Start 2P',monospace;font-weight:400;font-size:10px;line-height:1.5;color:#fff;text-shadow:2px 2px 0 rgba(27,21,48,.6)}
.landname small{display:block;font-size:14px;color:rgba(255,255,255,.85);margin-top:2px}
img.ic{margin:-4px 2px 0;vertical-align:middle}
.path{position:relative;margin-top:30px}
.path svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.nrow{height:92px;position:relative}
.node{position:absolute;top:10px;width:68px;height:68px;margin-left:-34px;border:4px solid var(--k);background:#fff;cursor:pointer;box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.6),4px 4px 0 var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;color:var(--k);padding:0}
.node .nn{font-size:15px}
.node .ns{font-size:9px;color:var(--gold2);margin-top:6px;letter-spacing:1px}
.node.done{background:var(--gold)}
.node.done .ns{color:var(--k)}
.node.cur{background:var(--acc);color:#fff;animation:pulse 1s steps(2) infinite}
.node.lock{background:#c9c3d6;color:#7d7698;box-shadow:inset -5px -5px 0 rgba(0,0,0,.12),3px 3px 0 #7d7698;border-color:#7d7698}
.node.castle{width:84px;height:80px;margin-left:-42px;top:4px;background:#9ee6ff}
.node.castle.done{background:var(--gold)}
.node.castle.cur{background:var(--acc)}
.node.castle.lock{background:#c9c3d6}
@keyframes pulse{50%{transform:translateY(-3px)}}
.me{position:absolute;top:-40px;left:50%;transform:translateX(-50%);animation:hop .8s steps(2) infinite;pointer-events:none;z-index:2}
/* setup */
textarea{width:100%;min-height:170px;border:4px solid var(--k);padding:10px;font:500 17px/1.4 'Pixelify Sans',monospace;color:var(--k);background:#fff;margin:6px 0 10px}
textarea.tall{min-height:260px}
.msg{font-size:16px;margin:4px 0 10px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok2)}
.setup ol{padding-left:22px;font-size:17px;line-height:1.45}
a{color:var(--pri2)}
/* play */
.qtext{font-size:24px;line-height:1.3;font-weight:600}
.words{font-size:23px;line-height:2;font-weight:600}
.words.long{font-size:20px;line-height:1.75}
.w.ok{color:var(--ok2)}
.blank{display:inline-block;height:1.05em;vertical-align:-.12em;border:0;border-bottom:4px dashed var(--pri);background:#ece4ff;cursor:pointer;padding:0;margin:0 1px}
.fb{display:inline-block;min-width:3.2em;border-bottom:4px solid #c9c3d6;line-height:1.3;color:transparent}
.fb.cur{border-color:var(--acc);background:#ffe9d1;animation:fbp 1s steps(2) infinite}
.fb.got{color:var(--ok2);border-color:var(--ok);min-width:0}
@keyframes fbp{50%{background:#ffd2a8}}
.cursor{display:inline-block;width:10px;height:.9em;background:var(--acc);vertical-align:-.08em;animation:blink 1s steps(1) infinite;margin-left:4px}
.bar{height:16px;border:4px solid var(--k);background:#fff;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s steps(6)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 18px}
.wt,.opt{border:4px solid var(--k);background:#fff;color:var(--k);font:600 21px 'Pixelify Sans',monospace;padding:10px 14px;cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12),3px 3px 0 var(--k);min-height:52px}
.wt:active,.opt:active{transform:translate(2px,2px);box-shadow:none}
.wt.used{visibility:hidden}
.wt.glow,.opt.glow{background:#fff4c2;outline:4px solid var(--gold);outline-offset:-10px}
.opt.bad{background:#ffe1e7;color:var(--bad);box-shadow:none;text-decoration:line-through;border-color:var(--bad)}
.opt.good{background:#d4f7e1;border-color:var(--ok2)}
.opts{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.opt.long{font-size:18px;text-align:left;line-height:1.35;padding:12px 14px}
.hearts{display:flex;gap:6px;align-items:center}
.gamebar{display:flex;align-items:center;gap:10px;margin:-4px 0 12px;flex-wrap:wrap}
.gamebar .sp{flex:1}
.tip{text-align:center;font-size:17px;color:var(--k);background:rgba(255,255,255,.7);border:4px solid var(--k);padding:8px 10px;margin:0 0 14px}
.round{font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;background:var(--pri);border:4px solid var(--k);padding:8px}
.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--k);padding:8px calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px);display:flex;justify-content:center;gap:8px}
.nav button{flex:1;max-width:130px;border:4px solid #4a4170;background:#2b2350;color:#fff;font-family:'Press Start 2P',monospace;font-size:8px;padding:6px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.nav button.on{background:var(--pri);border-color:var(--gold)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(27,21,48,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--paper);border:4px solid var(--k);box-shadow:8px 8px 0 rgba(0,0,0,.4);width:100%;max-width:440px;padding:20px;text-align:center;max-height:92vh;overflow:auto}
.sheet h2{font-size:16px;margin:8px 0 10px;color:var(--pri2)}
.sheet p{font-size:18px;margin:6px 0}
.bigstars{display:flex;justify-content:center;gap:10px;margin:12px 0;font-size:44px;font-family:'Press Start 2P',monospace}
.bigstars span{color:#d8d1e6;text-shadow:3px 3px 0 var(--k)}
.bigstars span.on{color:var(--gold);animation:pop .5s steps(4) both}
.bigstars span.on:nth-child(2){animation-delay:.25s}.bigstars span.on:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.rewards{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px;align-items:center}
.rw{display:flex;align-items:center;gap:10px;font-family:'Press Start 2P',monospace;font-size:11px;background:#fff;border:4px solid var(--k);padding:6px 12px}
/* flock */
.pasture{position:relative;height:340px;border:4px solid var(--k);background:var(--grass);box-shadow:inset 0 -24px 0 var(--grass2),6px 6px 0 rgba(27,21,48,.35);overflow:hidden;margin-bottom:16px}
.pasture .fence{position:absolute;left:0;right:0;top:18px;height:16px;border-top:4px solid #a86b3c;border-bottom:4px solid #a86b3c}
.lamb{position:absolute;cursor:pointer;padding:0;border:0;background:none;animation:graze 2.4s steps(2) infinite}
.lamb.flip img{transform:scaleX(-1)}
@keyframes graze{50%{transform:translateY(-3px)}}
.shep{position:absolute;left:50%;bottom:30px;transform:translateX(-50%)}
.hills{position:relative;height:60px;margin:-4px 0 -4px;border:4px solid var(--k);border-bottom:0;background:#8fb98a;box-shadow:inset 0 -14px 0 #6f9a6a;overflow:hidden}
.stray{position:absolute;opacity:.85;animation:graze 3s steps(2) infinite}
.stray.flip img{transform:scaleX(-1)}
.found{font-family:'Press Start 2P',monospace;font-size:10px;background:#fff;border:4px solid var(--k);padding:6px 8px;display:flex;align-items:center;gap:6px}
.nav button{position:relative}
.badge{position:absolute;top:-8px;right:6px;min-width:22px;height:22px;padding:0 4px;background:var(--bad);color:#fff;border:3px solid var(--k);font-size:9px;line-height:16px;text-align:center;animation:pulse 1s steps(2) infinite}
/* shop */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border:4px solid var(--k);background:#fff;padding:10px 4px;text-align:center;cursor:pointer;color:var(--k);font:inherit;box-shadow:3px 3px 0 var(--k)}
.item.on{background:#fff4c2;outline:4px solid var(--gold);outline-offset:-10px}
.item .in{font-family:'Press Start 2P',monospace;font-size:9px;margin-top:8px}
.item .ip{font-size:15px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:4px}
.hrow{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.hrow button{border:4px solid var(--k);background:#fff;padding:6px;cursor:pointer}
.hrow button.on{background:#fff4c2;outline:3px solid var(--gold);outline-offset:-8px}
/* music */
.song{display:flex;align-items:center;gap:12px;border:4px solid var(--k);background:#fff;padding:10px 12px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;color:var(--k);font:inherit;box-shadow:3px 3px 0 var(--k)}
.song.on{background:#fff4c2}
.song .st{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.5}
.song .sb{font-size:15px;color:var(--mut);margin-top:4px}
.song .si{width:40px;height:40px;border:4px solid var(--k);display:grid;place-items:center;flex:none;font-family:'Press Start 2P',monospace;font-size:12px;background:var(--gold)}
.song.lock .si{background:#c9c3d6}
.song .pr{margin-left:auto;display:flex;align-items:center;gap:4px;font-family:'Press Start 2P',monospace;font-size:10px;flex:none}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:6px;background:var(--pri);animation:eq .5s steps(3) infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%{height:6px}50%{height:22px}100%{height:12px}}
.krow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.kin{flex:1;min-width:0;border:4px solid var(--k);padding:8px;font:600 18px 'Pixelify Sans',monospace;color:var(--k)}
.tog{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:19px}.tog input{width:24px;height:24px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:40;background:var(--k);color:#fff;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.5;padding:12px 14px;border:4px solid var(--gold);max-width:90vw;text-align:center}
.node .crn{position:absolute;top:-12px;right:-12px;pointer-events:none}
.gbtn{display:flex;align-items:center;gap:10px;margin:10px 0 0;border:4px solid var(--k);background:var(--paper);color:var(--k);padding:6px 12px 6px 6px;font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;cursor:pointer;box-shadow:4px 4px 0 var(--k);text-align:left;max-width:100%}
.gbtn.new{background:#fff4c2;animation:pulse 1s steps(2) infinite}
.gbtn.won{background:#d4f7e1}
.arena{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 16px 0;margin:0 0 16px;border:4px solid var(--k);background:linear-gradient(transparent 70%,var(--grass) 70%);box-shadow:6px 6px 0 rgba(27,21,48,.35);position:relative}
.arena .foe{text-align:center;flex:1}
.arena .foe img{animation:graze 1.6s steps(2) infinite}
.arena .foe.hit img{animation:hit .5s steps(5)}
@keyframes hit{20%,60%{transform:translateX(8px);filter:brightness(3)}40%,80%{transform:translateX(-8px)}}
.hp{height:16px;border:4px solid var(--k);background:#fff;margin:6px 0 10px}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s steps(6)}
.foename{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;background:var(--k);color:#fff;padding:4px 6px;display:inline-block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
</style>
</head>
<body>
<div class="clouds"><div class="cloud" style="top:9%;animation-duration:70s;animation-delay:-20s"></div><div class="cloud" style="top:26%;animation-duration:95s;animation-delay:-60s"></div><div class="cloud" style="top:58%;animation-duration:80s;animation-delay:-5s"></div></div>
<div id="app"></div>
<div id="nav"></div>
<div id="modal"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script src="catechisms.js"></script>
<script>
(function(){

// ----- saving -----
// This device keeps everything in localStorage. When the page runs inside Claude with the
// db capability, each kid is also saved as their own document ("kid_<id>"), so two devices
// playing different kids never overwrite each other. Which kid is playing, sound and music stay per device.
let COL=null,UNSUB=null,READY=false,CLOUD=false,flushing=false,saveT=null;
const DIRTY=new Set();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(k){
 if(k&&k.id){k.at=Date.now();DIRTY.add(k.id);}
 persist();
 if(DIRTY.size||S.dels.length){clearTimeout(saveT);saveT=setTimeout(flush,900);}
}
function goLocal(){COL=null;CLOUD=false;READY=false;if(UNSUB){try{UNSUB();}catch(e){}}UNSUB=null;safeRender();}
async function flush(){
 if(!COL||!READY||flushing)return;flushing=true;
 try{
  while(COL&&(DIRTY.size||S.dels.length)){
   let job,back;
   if(S.dels.length){const id=S.dels[0];job=COL.doc('kid_'+id).delete().then(()=>{S.dels=S.dels.filter(x=>x!==id);persist();});back=()=>{};}
   else{
    const id=[...DIRTY][0];DIRTY.delete(id);back=()=>DIRTY.add(id);
    const k=S.kids.find(x=>x.id===id);if(!k)continue;
    const b=clone(k);delete b.synced;job=COL.doc('kid_'+id).set(b).then(()=>{k.synced=true;persist();});
   }
   try{await job;if(!CLOUD){CLOUD=true;if(V.name==='settings')render();}}
   catch(e){
    const c=e&&e.code;back();
    if(c==='invalid_argument'||c==='revoked'){goLocal();break;} // e.g. a link viewer who can't save to the cloud
    clearTimeout(saveT);saveT=setTimeout(flush,c==='quota_exceeded'?60000:5000);break;
   }
  }
 }finally{flushing=false;}
}
function applySnap(snap){
 const rk={};snap.docs.forEach(d=>{if(d.exists&&d.id.startsWith('kid_'))rk[d.id.slice(4)]=d.data();});
 const final=!snap.metadata.fromCache;let changed=false;
 Object.keys(rk).forEach(id=>{
  if(S.dels.includes(id))return;const r=rk[id],l=S.kids.find(x=>x.id===id);
  if(!l){S.kids.push(Object.assign(clone(r),{synced:true}));changed=true;}
  else if(!DIRTY.has(id)&&(r.at||0)>(l.at||0)){Object.assign(l,clone(r),{synced:true});changed=true;}
  else{l.synced=true;if(final&&(l.at||0)>(r.at||0))DIRTY.add(id);}
 });
 if(final){
  S.kids=S.kids.filter(k=>{
   if(rk[k.id]||DIRTY.has(k.id))return true;
   if(k.synced&&!(inGame(V.name)&&k.id===S.kidId)){changed=true;return false;} // removed on another device
   DIRTY.add(k.id);return true;
  });
  if(Object.keys(rk).length)CLOUD=true;
  if(!READY){READY=true;changed=true;}
 }
 if(changed){fix();persist();safeRender();}
 if(DIRTY.size||S.dels.length)flush();
}

const MU={on:false,k:-1,timer:null,master:null,seq:null,i:0,t:0,bt:0,beat:0,spb:.5,bar:4,pick:0,noise:null};
function midiOf(n){const m=n.match(/^([A-G])(#|b)?(\d)$/);if(!m)return 60;const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 12*(+m[3]+1)+b;}
const hz=m=>440*Math.pow(2,(m-69)/12);
function parseSong(s){return s.trim().split(/\s+/).map(tok=>{const [n,d]=tok.split(':');return{r:n==='R',m:n==='R'?0:midiOf(n),d:parseFloat(d)};});}
function voice(a,f,t,d,type,vol,dest){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+Math.max(.02,d*.7));g.gain.linearRampToValueAtTime(.0001,t+Math.max(.04,d*.94));o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);}
function hat(a,t,dest,v){if(!MU.noise){const b=a.createBuffer(1,a.sampleRate*.1,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;MU.noise=b;}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=MU.noise;f.type='highpass';f.frequency.value=6500;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+.06);}
function kick(a,t,dest){const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.16);}
// The jukebox plays the kid's unlocked hymns on shuffle: each one plays once through, then a
// different unlocked hymn starts. Every hymn plays once before any plays again.
function playSong(k){
 const a=ac();if(!a)return;stopSong();
 const s=SONGS[k];if(!s)return;
 const master=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;master.gain.value=.5;lp.connect(master);master.connect(a.destination);
 Object.assign(MU,{on:true,k,master,lp,seq:parseSong(s.n),i:0,spb:60/s.bpm,bar:s.bar,pick:s.pick||0,t:a.currentTime+.12,beat:0,end:0});
 MU.bt=MU.t;MU.bag=(MU.bag||[]).filter(x=>x!==k);
 MU.timer=setInterval(sched,50);sched();
 if(V.name==='music')render();
}
function nextSong(){
 const k=kid(),own=k?k.songs.filter(i=>SONGS[i]):[];if(!own.length)return 0;
 MU.bag=(MU.bag||[]).filter(i=>own.includes(i)&&i!==MU.k);
 if(!MU.bag.length)MU.bag=shuffle(own.filter(i=>i!==MU.k||own.length===1));
 return MU.bag.shift();
}
function sched(){
 const a=AC;if(!a||!MU.on)return;const horizon=a.currentTime+.3;
 if(MU.end){if(a.currentTime>=MU.end)playSong(nextSong());return;}
 while(MU.t<horizon&&MU.i<MU.seq.length){
  const nt=MU.seq[MU.i],dur=nt.d*MU.spb;
  if(!nt.r){voice(a,hz(nt.m),MU.t,dur,'square',.07,MU.lp);voice(a,hz(nt.m-12),MU.t,dur,'triangle',.16,MU.lp);}
  MU.t+=dur;MU.i++;
 }
 while(MU.bt<horizon&&MU.bt<MU.t-.001){
  const pos=((MU.beat-MU.pick)%MU.bar+MU.bar)%MU.bar;
  if(pos===0)kick(a,MU.bt,MU.master);
  hat(a,MU.bt,MU.master,pos===0?.05:.03);
  MU.bt+=MU.spb;MU.beat++;
 }
 if(MU.i>=MU.seq.length&&MU.bt>=MU.t-.001)MU.end=MU.t+MU.spb*2;   // a short breath between hymns
}
function stopSong(){
 if(MU.timer)clearInterval(MU.timer);MU.timer=null;MU.on=false;
 if(MU.master&&AC){const m=MU.master;try{m.gain.setValueAtTime(m.gain.value,AC.currentTime);m.gain.linearRampToValueAtTime(.0001,AC.currentTime+.15);}catch(e){}setTimeout(()=>{try{m.disconnect();}catch(e){}},400);}
 MU.master=null;MU.k=-1;
}
function syncMusic(){
 const k=kid();if(!(S.music&&k&&V.name!=='title')){if(MU.on)stopSong();return;}
 // keep the current hymn going; start over only when nothing plays or this kid hasn't unlocked it
 if(!MU.on||!k.songs.includes(MU.k)){MU.bag=[];playSong(k.songs.includes(k.song)?k.song:0);}
}

// ================= PATH =================
// Each catechism is split into lands (4 questions each, or one Lord's Day); every land ends in a bonus castle.
function nodes(){const q=QD(),out=[];if(!q)return out;q.lands.forEach((l,s)=>{l.qs.forEach(n=>out.push({t:'q',i:n-1,s}));out.push({t:'c',s});});return out;}
function isDone(k,n){return n.t==='q'?stars(k,n.i)>0:!!k.cps[ckey(k.quest,n.s)];}
function curIdx(k){const ns=nodes();const i=ns.findIndex(n=>!isDone(k,n));return i<0?ns.length:i;}
const isOpen=k=>!!(k&&k.open[k.quest]);   // a grown-up let this kid play any level
const shortText=(t,n)=>{const w=words(t);return w.length>n?w.slice(0,n).join(' ')+' …':t;};

// ----- reading pasted questions and answers (for quests families make themselves) -----
// Question numbers like "1.", "Q1:", "Question 1" (but not a verse ref like "3:16").
const QPRE=[/^(?:question|q)\s*\d+\s*[:.)\-–]?\s*/i,/^(?:question|q)\s*[:.)\-–]\s*/i,/^\d+\s*(?:[.)\-–]|:(?!\d))\s*/];
// Answer labels: "Answer:", "Children's Answer", "Adult answer:" (straight or curly apostrophes).
const ALAB=/^(?:(children'?s|child'?s|kids'?|kid'?s)\s+|(adults?'?s?)\s+)?answers?\s*(?:[:.)\-–]\s*|$)/i;
const APRE=/^a\s*[:.)\-–]\s*/i;
const QEND=/\?["”’)]*$/;
const QSPLIT=/^(.*?\?["”’)]*)\s+(\S.*)$/;
function parseQA(t,use){
 const out=[];let cur=null;
 const addA=l=>{
  if(!cur)return;
  const m=l.replace(/[’‘]/g,"'").match(ALAB);
  if(m){cur.slot=m[1]?'child':m[2]?'adult':'a';l=l.slice(m[0].length);}
  else if(APRE.test(l))l=l.replace(APRE,'');
  l=l.trim();if(l)cur[cur.slot]=(cur[cur.slot]?cur[cur.slot]+' ':'')+l;
 };
 const addQ=text=>{
  text=text.trim();if(!text)return;
  const m=text.match(QSPLIT);
  if(m&&!QEND.test(text)){cur.q=(cur.q?cur.q+' ':'')+m[1];cur.open=false;addA(m[2]);return;}
  cur.q=(cur.q?cur.q+' ':'')+text;if(QEND.test(text))cur.open=false;
 };
 const startQ=text=>{cur={q:'',open:true,a:'',child:'',adult:'',slot:'a'};out.push(cur);addQ(text);};
 const hasA=c=>!!(c.a||c.child||c.adult);
 String(t||'').split(/\r?\n/).forEach(raw=>{
  const l=raw.trim();if(!l)return;
  if(/^questions?\s*:?$/i.test(l))return;
  for(const re of QPRE){const m=l.match(re);if(m)return startQ(l.slice(m[0].length));}
  const isLabel=ALAB.test(l.replace(/[’‘]/g,"'"))||APRE.test(l);
  if(cur&&cur.open&&!isLabel)return addQ(l);   // a question that wraps onto more lines
  if(isLabel)return addA(l);
  if(QEND.test(l))return startQ(l);
  if(QSPLIT.test(l)&&(!cur||hasA(cur)))return startQ(l); // "Question? Answer." on one line
  addA(l);
 });
 const both=out.some(x=>x.child&&x.adult);
 const items=out.map(x=>({q:x.q.trim(),a:(use==='adult'?(x.adult||x.a||x.child):(x.child||x.a||x.adult)).trim()})).filter(x=>x.q&&x.a).slice(0,400);
 return{items,both};
}
const serializeQA=qas=>qas.map((x,i)=>(i+1)+'. '+x.q+'\n'+x.a).join('\n\n');

  idx+=sec.length;
 });

}

// ----- fill -----
function makeFill(i,st){
 const w=words(QAS()[i].a);
 let cand=w.map((_,j)=>j).filter(j=>norm(w[j]).length>=3&&!STOP.has(norm(w[j])));
 if(!cand.length)cand=w.map((_,j)=>j);
 const frac=[.3,.3,.5,.7][st||0];
 const cnt=Math.max(1,Math.min(10,Math.round(w.length*frac),cand.length));
 const F={w,blanks:shuffle(cand).slice(0,cnt).sort((a,b)=>a-b),bi:0,opts:[],wrong:new Set(),i};
 makeOpts(F);return F;
}
function makeOpts(F){
 const correct=clean(F.w[F.blanks[F.bi]]),seen=new Set([norm(correct)]),picks=[];
 const add=x=>{const c=clean(x),n=norm(c);if(picks.length<2&&n.length>=2&&!seen.has(n)){seen.add(n);picks.push(c);}};
 shuffle(F.w).forEach(add);
 const others=[];QAS().forEach((q,j)=>{if(j!==F.i)words(q.a).forEach(x=>others.push(x));});
 shuffle(others).slice(0,200).forEach(add);
 ['God','love','life','heart','world','grace','truth','good'].forEach(add);
 F.opts=shuffle([correct,...picks]);F.wrong=new Set();
}

// ----- bonus -----
// Long answers are built a few chunks at a time (two in the castle), starting at a random point, with a few words before it as a cue.
function makeBuild(i,max){
 max=max||2;const all=words(QAS()[i].a);let segs=chunk(all),lead=[];
 if(segs.length>max){const s0=Math.floor(Math.random()*(segs.length-max+1)),start=segs.slice(0,s0).reduce((a,x)=>a+x.length,0);lead=all.slice(Math.max(0,start-4),start);segs=segs.slice(s0,s0+max);}
 const B={i,segs,lead,seg:0,pos:0,placed:[],tiles:[]};B.tiles=shuffleNew(B.segs[0].map((w,j)=>({w,id:j,used:false})));return B;
}
function makePick(i,rev){const n=N(),others=shuffle([...Array(n).keys()].filter(j=>j!==i)).slice(0,Math.min(2,n-1));return{i,rev:!!rev,opts:shuffle([i,...others]),wrong:new Set()};}
function startBonus(s){
 const n=N(),sec=QD().lands[s].qs.map(x=>x-1),earlier=[...Array(sec[0]).keys()];
 let rounds=sec.map(i=>({type:'pick',i}));
 if(n>=3){const r=rnd(sec);rounds.push({type:'pickq',i:r});}
 rounds.push({type:'build',i:rnd(sec)});
 if(earlier.length)rounds.push({type:n>=2?'pick':'build',i:rnd(earlier)});
 if(n<2)rounds=rounds.map(r=>({type:'build',i:r.i}));
 rounds=shuffle(rounds);
 V={name:'bonus',s};G={rounds,r:0,mistakes:0,cur:null};loadRound();render();window.scrollTo(0,0);
}
function loadRound(){const R=G.rounds[G.r];G.busy=false;G.cur=R.type==='build'?makeBuild(R.i):makePick(R.i,R.type==='pickq');}
function buildBody(C,lbl){

 <section class="box"><div class="lbl">PLAYERS</div>
 ${S.kids.map(x=>`<div class="krow">${x.hero?heroImg(x,3):''}<input class="kin" data-kid="${x.id}" value="${esc(x.name)}" maxlength="16" aria-label="Player name"><button class="btn sm bad" data-act="delKid" data-id="${x.id}">${DEL===x.id?'SURE?':'REMOVE'}</button></div>`).join('')}
 <button class="btn sm" data-act="players">SWITCH PLAYER</button></section>
 ${k&&q?`<section class="box"><div class="lbl">${esc(k.name.toUpperCase())} · ${esc(q.short.toUpperCase())}</div>
 <label class="tog"><input type="checkbox" id="openAll" ${isOpen(k)?'checked':''}> Let ${esc(k.name)} play any level (skip ahead)</label>
 <p class="tiny" style="margin-top:-4px">Handy if your family or church is already partway through the catechism.</p>
 <button class="btn sm bad" data-act="resetProg">${DEL==='reset'?'TAP AGAIN TO RESET':'RESET '+esc(k.name.toUpperCase())+'’S '+esc(q.short.toUpperCase())+' PROGRESS'}</button></section>`:''}
 <section class="box"><div class="lbl">MY QUESTS</div>
 ${S.custom.map(c=>`<div class="krow"><span style="flex:1;font-size:18px;overflow-wrap:anywhere">${esc(c.title)} <span class="tiny">(${c.qas.length})</span></span><button class="btn sm" data-act="mkEdit" data-id="${c.id}">EDIT</button><button class="btn sm bad" data-act="mkDel" data-id="${c.id}">${DEL==='q:'+c.id?'SURE?':'DELETE'}</button></div>`).join('')}
 <p class="tiny" style="margin-top:0">${S.custom.length?'Saved only on this device. Deleting a quest also erases everyone’s progress in it.':'Add your own catechism or memory verses as a new quest. It stays on this device.'}</p>
 <button class="btn sm" data-act="mkNew" data-back="settings">+ MAKE YOUR OWN QUEST</button></section>
 <section class="box"><div class="lbl">OPTIONS</div>
 <label class="tog"><input type="checkbox" id="snd" ${S.sound?'checked':''}> Sound effects</label>
 <label class="tog"><input type="checkbox" id="mus" ${S.music?'checked':''}> Music</label>${installHTML()}</section>
 <section class="box"><div class="lbl">ABOUT THE TEXTS</div>
 ${Object.keys(BUILT).map(id=>`<p class="src"><b>${esc(CAT[id].title)}</b> (${CAT[id].year}). ${esc(CAT[id].source)}</p>`).join('')}
 <p class="src">Footnote letters were removed from the Westminster text. In the Heidelberg Catechism, the numbers before the Creed's articles and the Lord's Prayer's petitions were removed so they read as recited, and four printing errors were corrected.</p></section>
 <p class="tiny center">${CLOUD?'Progress is saved to your Claude account and stays in sync across your devices.':'Progress is saved on this device.'}</p>`;
}

// ----- modal -----
function showModal(h){$('#modal').innerHTML=`<div class="ov"><div class="sheet">${h}</div></div>`;}
function closeModal(){$('#modal').innerHTML='';}

// ================= ACTIONS =================
function afterGesture(){if(!started){started=true;ac();}syncMusic();}
const A={
 start:()=>{sfx.tap();if(!S.kids.length)CR={hero:null,name:'',editId:null};nav({name:S.kids.length?'players':'create'});},
 players:()=>nav({name:'players'}),
 newHero:()=>{CR={hero:null,name:'',editId:null};nav({name:'create'});},
 pickKid:el=>{const k=S.kids.find(x=>x.id===el.dataset.id);if(!k)return;S.kidId=k.id;persist();if(!k.hero){CR={hero:null,name:k.name,editId:k.id};return nav({name:'create'});}nav({name:k.quest?'map':'quests'});},
 pickHero:el=>{const i=$('#cname');if(i)CR.name=i.value;CR.hero=el.dataset.h;sfx.tap();render();},
 createGo:()=>{
  const i=$('#cname');const name=((i&&i.value)||CR.name||'').trim()||HEROES[CR.hero].name;
  let k=CR.editId&&S.kids.find(x=>x.id===CR.editId);
  if(k){k.name=name;k.hero=CR.hero;}else{k=newKid(name,CR.hero);S.kids.push(k);}
  S.kidId=k.id;save(k);sfx.win();nav({name:k.quest?'map':'quests'});
 },
 pickQuest:el=>{const k=kid();k.quest=el.dataset.q;save(k);sfx.tap();nav({name:'map'});},
 go:el=>{const to=el.dataset.to;nav({name:to,i:V.i});},
 toggleMusic:()=>{S.music=!S.music;persist();syncMusic();render();},
 install:async()=>{if(!DEFER)return;const d=DEFER;DEFER=null;try{d.prompt();await d.userChoice;}catch(e){}render();},
 node:el=>{
  const k=kid(),gi=+el.dataset.g,cur=curIdx(k);
  if(gi>cur&&!isOpen(k)){sfx.bad();shake(el);toast('Finish the earlier levels first!');return;}
  sfx.tap();openNode(gi);
 },
 nextNode:()=>{
  const ns=nodes(),k=kid();let gi;
  if(V.name==='bonus'){gi=ns.findIndex(n=>n.t==='c'&&n.s===V.s)+1;}else{gi=ns.findIndex(n=>n.t==='q'&&n.i===V.i)+1;}
  if(gi>=ns.length||(gi>curIdx(k)&&!isOpen(k))){closeModal();return nav({name:'map'});}
  openNode(gi);
 },
 sayQ:()=>speak(QAS()[V.i].q),
 sayA:()=>speak(QAS()[V.i].a),
 sayBonusQ:()=>speak(QAS()[G.cur.i].q),
 toggleRefs:()=>{G.refs=!G.refs;render();},
 hideMore:()=>{G.level=Math.min(4,G.level+1);G.peek=new Set();sfx.tap();render();},
 showAll:()=>{G.level=0;G.peek=new Set();render();},
 peek:el=>{G.peek.add(+el.dataset.j);render();},
 startFill:()=>startFill(V.i),
 opt:el=>{
  if(G.done)return;
  const F=G.F,j=+el.dataset.k;
  if(norm(F.opts[j])===norm(F.w[F.blanks[F.bi]])){sfx.ok();F.bi++;if(F.bi>=F.blanks.length){render();return finishLevel();}makeOpts(F);render();
   const b=document.querySelector('.fb.cur');if(b){const r=b.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight*.55)b.scrollIntoView({block:'center'});}}
  else{G.mistakes++;F.wrong.add(j);sfx.bad();render();shake(document.querySelector(`.opt[data-k="${j}"]`));}
 },
 useSword:()=>{
  const k=kid();if(k.swords<1||G.busy||G.done)return;
  if(V.name==='fill'){const F=G.F,correct=norm(F.w[F.blanks[F.bi]]);const left=F.opts.map((o,j)=>j).filter(j=>!F.wrong.has(j)&&norm(F.opts[j])!==correct);if(!left.length)return toast('Only the right answer is left!');F.wrong.add(rnd(left));}
  else if(['bonus','guard','build'].includes(V.name)){const C=G.cur;
   if(C.segs){const exp=C.segs[C.seg][C.pos];const t=C.tiles.find(x=>!x.used&&norm(x.w)===norm(exp));if(!t)return;k.swords--;save(k);sfx.sword();render();const b=document.querySelector(`.wt[data-id="${t.id}"]`);if(b)b.classList.add('glow');return;}
   const left=C.opts.filter(j=>j!==C.i&&!C.wrong.has(j));if(!left.length)return toast('Only the right answer is left!');C.wrong.add(rnd(left));}
  else return;
  k.swords--;save(k);sfx.sword();render();
 },
 tile:el=>{
  if(G.busy)return;
  const C=G.cur,t=C.tiles.find(x=>x.id===+el.dataset.id);if(!t||t.used)return;
  const seg=C.segs[C.seg],exp=seg[C.pos];
  if(norm(t.w)===norm(exp)){
   t.used=true;C.placed.push(exp);C.pos++;sfx.ok();
   if(C.pos>=seg.length){C.seg++;C.pos=0;if(C.seg>=C.segs.length){render();return advanceSoon(500);}C.tiles=shuffleNew(C.segs[C.seg].map((w,j)=>({w,id:j,used:false})));}
   render();
  }else{missed();shake(el);const hb=document.querySelector('.hearts');if(hb)hb.outerHTML=gameHearts();}
 },
 pick:el=>{
  if(G.busy)return;
  const C=G.cur,j=+el.dataset.j;
  if(j===C.i){sfx.ok();el.classList.add('good');advanceSoon(450);}
  else{missed();C.wrong.add(j);render();shake(document.querySelector(`.opt[data-j="${j}"]`));}
 },
 startHerd:()=>{closeModal();sfx.tap();startHerd();},
 startBuild:()=>{const i=V.i;closeModal();sfx.tap();startBuild(i);},
 guard:el=>{closeModal();sfx.tap();startGuard(+el.dataset.s);},
 guardAgain:()=>{closeModal();startGuard(V.s);},
 herdPick:el=>{
  if(G.busy||G.done)return;const C=G.cur,j=+el.dataset.j;
  if(j===C.i){el.classList.add('good');herdResult(!G.miss);}
  else{G.miss=true;C.wrong.add(j);sfx.bad();render();shake(document.querySelector(`.opt[data-j="${j}"]`));}
 },
 herdShow:()=>{G.cur.show=true;speak(QAS()[G.cur.i].a);render();},
 herdSelf:el=>{if(G.busy||G.done)return;herdResult(el.dataset.ok==='1');},
 sayHerdQ:()=>speak(QAS()[G.cur.i].q),
 lamb:el=>{const i=+el.dataset.i,it=QAS()[i],r=srsOf(kid(),i);sfx.tap();showModal(`${spr('sheep',6)}<h2>LAMB #${it.n}</h2><p><b>Q${it.n}.</b> ${esc(it.q)}</p><p style="color:var(--mut)">Can you say the answer?${r?`<br><span class="tiny">This lamb may wander ${daysText(r.d-today())}.</span>`:''}</p><div class="col"><button class="btn" data-act="lambAns" data-i="${i}">SHOW ANSWER</button><button class="btn" data-act="closeModal">CLOSE</button></div>`);speak(it.q);},
 lambAns:el=>{const it=QAS()[+el.dataset.i];el.outerHTML=`<p style="font-size:20px;text-align:left"><b>${esc(it.a)}</b></p>`;speak(it.a);},
 closeModal:()=>closeModal(),
 setHero:el=>{const k=kid();k.hero=el.dataset.h;save(k);sfx.tap();render();},
 color:el=>{
  const k=kid(),h=k.hero,i=+el.dataset.i,c=HEROES[h].colors[i],owned=k.owned[h]||(k.owned[h]=[0]);
  if(i===0||owned.includes(i)){k.colors[h]=i;save(k);sfx.tap();return render();}
  if(k.coins<c.cost){sfx.bad();return toast('Not enough coins yet!');}
  k.coins-=c.cost;owned.push(i);k.colors[h]=i;save(k);sfx.coin();render();toast('New look unlocked!');
 },
 buySword:()=>{const k=kid();if(k.coins<SWORD_COST){sfx.bad();return toast('Not enough coins yet!');}k.coins-=SWORD_COST;k.swords++;save(k);sfx.coin();render();},
 song:el=>{
  const k=kid(),i=+el.dataset.i;
  if(!k.songs.includes(i)){if(k.coins<SONG_COST){sfx.bad();return toast('Not enough coins yet!');}k.coins-=SONG_COST;k.songs.push(i);sfx.coin();toast('Hymn unlocked!');}
  k.song=i;S.music=true;save(k);playSong(i);render();
 },
 delKid:el=>{const id=el.dataset.id;if(DEL!==id){DEL=id;return render();}S.kids=S.kids.filter(k=>k.id!==id);DIRTY.delete(id);if(!S.dels.includes(id))S.dels.push(id);DEL=null;fix();save();if(!kid())return nav({name:S.kids.length?'players':'create'});render();},
 mkNew:el=>{MK={id:null,title:'',text:'',ans:'child',back:el.dataset.back||'quests'};nav({name:'maker'});},
 mkEdit:el=>{const c=S.custom.find(x=>x.id===el.dataset.id);if(!c)return;MK={id:c.id,title:c.title,text:serializeQA(c.qas),ans:'child',back:'settings'};nav({name:'maker'});},
 mkSave:()=>{
  const ti=$('#mkTitle'),tx=$('#mkText');if(ti)MK.title=ti.value;if(tx)MK.text=tx.value;
  const r=parseQA(MK.text,MK.ans);
  if(!r.items.length){sfx.bad();shake($('#mkCount'));return toast('Add at least one question and answer');}
  const title=MK.title.trim()||'My Quest',isNew=!MK.id;
  let c=!isNew&&S.custom.find(x=>x.id===MK.id);
  if(c){c.title=title;c.qas=r.items;}else{c={id:'my_'+uid(),title,qas:r.items,made:Date.now()};S.custom.push(c);}
  fix();persist();sfx.win();
  const k=kid();
  if(isNew&&k&&k.hero){k.quest=c.id;save(k);nav({name:'map'});}else nav({name:MK.back});
  toast('Quest saved!');
 },
 mkDel:el=>{
  const id=el.dataset.id;if(DEL!=='q:'+id){DEL='q:'+id;return render();}
  S.custom=S.custom.filter(c=>c.id!==id);const p=id+':';
  S.kids.forEach(k=>{let ch=false;[k.prog,k.cps,k.srs,k.mast,k.guard].forEach(o=>Object.keys(o).forEach(x=>{if(x.startsWith(p)){delete o[x];ch=true;}}));
   if(id in k.open){delete k.open[id];ch=true;}if(k.quest===id){k.quest=null;ch=true;}if(ch)save(k);});
  DEL=null;fix();persist();render();toast('Quest deleted');
 },
 resetProg:()=>{
  if(DEL!=='reset'){DEL='reset';return render();}
  const k=kid(),p=k.quest+':';[k.prog,k.cps,k.srs,k.mast,k.guard].forEach(o=>Object.keys(o).forEach(x=>{if(x.startsWith(p))delete o[x];}));
  DEL=null;save(k);render();toast('Progress reset');
 }
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el||el.disabled){if(V.name==='title'){A.start();afterGesture();}return;}
 const f=A[el.dataset.act];if(f)f(el,e);afterGesture();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('.kin')){const k=S.kids.find(x=>x.id===t.dataset.kid);if(k){k.name=t.value.trim()||k.name;save(k);}}
 if(t.id==='snd'){S.sound=t.checked;persist();}
 if(t.id==='mus'){S.music=t.checked;persist();syncMusic();}
 if(t.id==='openAll'){const k=kid();if(k){k.open[k.quest]=t.checked;save(k);}}
 if(t.name==='mkAns'){MK.ans=t.value;const c=$('#mkCount');if(c)c.textContent=mkCountText();}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='cname')CR.name=t.value;
 if(t.id==='mkTitle')MK.title=t.value;
 if(t.id==='mkText'){MK.text=t.value;const c=$('#mkCount'),b=$('#mkBoth');if(c)c.textContent=mkCountText();if(b)b.style.display=parseQA(MK.text).both?'block':'none';}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cname'&&CR.hero)A.createGo();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSong();});

render();
initCloud();
// Offline support when installed from a website (not inside Claude, where service workers aren't available).
try{if(window.top===window&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}catch(e){}
// test hook
window.__CQ={get S(){return S;},MU,SONGS,get V(){return V;},get G(){return G;},A,nodes,curIdx,render,startBonus,startFill,finishLevel,startBuild,startGuard,landDone,stars,QAS,QD,fix,parseQA,CAT};
})();
</script>
</body>
</html>
